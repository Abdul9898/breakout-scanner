<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Futures Breakout Scanner (Top 200)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
    <style>
        :root { --bg: #0b0e11; --card: #1e2329; --text: #eaecef; --accent: #0ecb81; --danger: #f6465d; --purple: #a55eea; --border: #2b3139; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 12px; background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        h1 { margin: 0; font-size: 1rem; color: var(--purple); white-space: nowrap; }
        .controls { display: flex; gap: 8px; }
        button { padding: 8px 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.8rem; color: white; transition: all 0.2s; }
        #refresh-btn { background: var(--purple); }
        #auto-btn { background: #2b3139; border: 1px solid var(--border); }
        #auto-btn.active { background: var(--accent); color: black; box-shadow: 0 0 10px rgba(14, 203, 129, 0.4); }
        button:disabled { opacity: 0.5; }
        #main-content { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .table-container { background: var(--card); border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; background: #252a33; color: #848e9c; font-size: 0.75rem; text-transform: uppercase; border-bottom: 1px solid var(--border); position: sticky; top: 0; }
        td { padding: 12px; border-bottom: 1px solid var(--border); font-size: 0.9rem; cursor: pointer; }
        tr:last-child td { border-bottom: none; }
        tr:active { background: rgba(165, 94, 234, 0.1); }
        .symbol-col { font-weight: bold; color: #fff; }
        .price-col { font-family: monospace; }
        .change-col { font-weight: bold; }
        .signal-col { text-align: center; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; display: inline-block; }
        .badge-bull { background: rgba(14, 203, 129, 0.2); color: var(--accent); border: 1px solid var(--accent); }
        .badge-bear { background: rgba(246, 70, 93, 0.2); color: var(--danger); border: 1px solid var(--danger); }
        #chart-view { display: none; flex-direction: column; height: 100%; position: fixed; top: 0; left: 0; width: 100%; background: var(--bg); z-index: 200; }
        .chart-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; padding: 12px; background: var(--card); border-bottom: 1px solid var(--border); }
        .back-btn { background: var(--border); color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
        .chart-box { background: var(--card); padding: 10px; border-radius: 8px; height: calc(100vh - 140px); position: relative; border: 1px solid var(--border); margin: 15px; }
        .chart-hint { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 4px 8px; border-radius: 3px; font-size: 0.65rem; z-index: 10; pointer-events: none; }
        .loader { text-align: center; color: var(--purple); padding: 20px; font-size: 0.9rem; }
        .empty-state { text-align: center; color: #5e6673; margin-top: 50px; }
        .error-msg { text-align: center; color: var(--danger); margin-top: 20px; font-size: 0.8rem; }
        .status-bar { text-align: center; font-size: 0.75rem; color: #848e9c; margin-top: 5px; }
    </style>
</head>
<body>
<div id="list-view" style="display: flex; flex-direction: column; height: 100%;">
    <header>
        <h1> 🔍 Breakout Scanner (200)</h1>
        <div class="controls">
            <button id="auto-btn" onclick="toggleAuto()">Auto: OFF</button>
            <button id="refresh-btn" onclick="startScan()">SCAN</button>
        </div>
    </header>
    <div id="main-content">
        <div id="loader" class="loader">Scanning Top 200 Futures... (This may take ~60s)</div>
        <div id="empty-msg" class="empty-state" style="display:none;">No breakouts detected right now.<br>Keep Auto ON to catch new signals.</div>
        <div id="error-msg" class="error-msg" style="display:none;"></div>
        <div id="status-bar" class="status-bar"></div>
        <div class="table-container">
            <table>
                <thead>
                    <tr><th>Coin</th><th>Price</th><th>24h %</th><th>Signal</th></tr>
                </thead>
                <tbody id="results-body"></tbody>
            </table>
        </div>
        <div style="text-align:center; color:#5e6673; font-size:0.7rem; margin-top:10px;">Tap any row to view chart • Scans 4H Timeframe</div>
    </div>
</div>
<div id="chart-view">
    <header class="chart-header">
        <button class="back-btn" onclick="closeChart()">← Back</button>
        <h1 id="chart-title" style="margin:0; font-size:1rem; color:white;">COIN</h1>
    </header>
    <div style="flex:1; display:flex; flex-direction:column;">
        <div class="chart-box">
            <div class="chart-hint"> Drag to pan • Pinch to zoom</div>
            <canvas id="priceChart"></canvas>
        </div>
        <div style="text-align:center; color:#5e6673; font-size:0.7rem; margin-top:5px;">Binance Futures | 4H Timeframe</div>
    </div>
</div>
<script>
    let myChart = null;
    let autoInterval = null;
    let isAutoOn = false;
    window.onload = startScan;
    function toggleAuto() {
        const btn = document.getElementById('auto-btn');
        const status = document.getElementById('status-bar');
        if (isAutoOn) {
            clearInterval(autoInterval);
            autoInterval = null;
            isAutoOn = false;
            btn.innerText = "Auto: OFF";
            btn.classList.remove('active');
            status.innerText = "Auto-scan stopped.";
        } else {
            isAutoOn = true;
            btn.innerText = "Auto: ON (90s)";
            btn.classList.add('active');
            status.innerText = "Auto-scanning every 90 seconds...";
            startScan(); 
            autoInterval = setInterval(startScan, 90000);
        }
    }
    async function startScan() {
        const btn = document.getElementById('refresh-btn');
        const loader = document.getElementById('loader');
        const tbody = document.getElementById('results-body');
        const emptyMsg = document.getElementById('empty-msg');
        const errorMsg = document.getElementById('error-msg');
        const statusBar = document.getElementById('status-bar');
        if (!isAutoOn) btn.disabled = true;
        loader.style.display = 'block';
        loader.innerText = "Scanning Top 200 Futures... (Please wait)";
        tbody.innerHTML = '';
        emptyMsg.style.display = 'none';
        errorMsg.style.display = 'none';
        const startTime = Date.now();
        try {
            const res = await fetch('https://fapi.binance.com/fapi/v1/ticker/24hr');
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            const allCoins = data.filter(t => t.symbol.endsWith('USDT') && !t.symbol.includes('UP') && !t.symbol.includes('DOWN'));
            const topCoins = allCoins.sort((a, b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume)).slice(0, 200);
            console.log(` Scanning ${topCoins.length} coins...`);
            loader.innerText = `Scanning ${topCoins.length} coins...`;
            let signals = [];
            for (let i = 0; i < topCoins.length; i += 10) {
                const batch = topCoins.slice(i, i + 10);
                const promises = batch.map(coin => checkBreakout(coin));
                const results = await Promise.all(promises);
                results.forEach(r => { if (r) signals.push(r); });
                const progress = Math.min(100, Math.floor((i / topCoins.length) * 100));
                loader.innerText = `Scanning... ${progress}%`;
                await new Promise(r => setTimeout(r, 250));
            }
            loader.style.display = 'none';
            const scanTime = ((Date.now() - startTime)/1000).toFixed(1);
            if (isAutoOn) statusBar.innerText = `Last scan: ${scanTime}s ago • Next in 90s`;
            if (signals.length === 0) {
                emptyMsg.style.display = 'block';
            } else {
                signals.sort((a, b) => b.strength - a.strength);
                signals.forEach(signal => {
                    const row = document.createElement('tr');
                    row.onclick = () => openChart(signal.symbol, signal.klines, signal.breakoutLevel, signal.type);
                    const changeNum = parseFloat(signal.change) || 0;
                    const changeColor = changeNum >= 0 ? 'var(--accent)' : 'var(--danger)';
                    const badgeClass = signal.type === 'bullish' ? 'badge-bull' : 'badge-bear';
                    const badgeText = signal.type === 'bullish' ? '▲ BREAKOUT' : '▼ DUMP';
                    row.innerHTML = `<td class="symbol-col">${signal.symbol.replace('USDT','')}</td><td class="price-col">$${parseFloat(signal.price).toLocaleString()}</td><td class="change-col" style="color:${changeColor}">${changeNum > 0 ? '+' : ''}${changeNum.toFixed(2)}%</td><td class="signal-col"><span class="badge ${badgeClass}">${badgeText}</span></td>`;
                    tbody.appendChild(row);
                });
            }
        } catch (err) {
            console.error(" Scan failed:", err);
            if (!isAutoOn) {
                errorMsg.innerText = `Error: ${err.message}. Try again.`;
                errorMsg.style.display = 'block';
            }
            loader.style.display = 'none';
        } finally {
            if (!isAutoOn) btn.disabled = false;
        }
    }
    async function checkBreakout(coin) {
        const symbol = coin.symbol;
        try {
            const kRes = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=4h&limit=20`);
            if (!kRes.ok) return null;
            const klines = await kRes.json();
            if (klines.length < 5) return null;
            const prices = klines.map(k => parseFloat(k[4]));
            const highs = klines.map(k => parseFloat(k[2]));
            const lows = klines.map(k => parseFloat(k[3]));
            const threshold = 0.01; 
            const currentPrice = prices[prices.length-1];
            const prevHighs = [highs[prices.length-2], highs[prices.length-3], highs[prices.length-4]];
            const prevLows = [lows[prices.length-2], lows[prices.length-3], lows[prices.length-4]];
            const maxPrevHigh = Math.max(...prevHighs);
            const minPrevLow = Math.min(...prevLows);
            let type = null;
            let strength = 0;
            let breakoutLevel = 0;
            if (currentPrice > maxPrevHigh * (1 + threshold)) {
                type = 'bullish';
                strength = (currentPrice - maxPrevHigh) / maxPrevHigh;
                breakoutLevel = maxPrevHigh;
            } else if (currentPrice < minPrevLow * (1 - threshold)) {
                type = 'bearish';
                strength = (minPrevLow - currentPrice) / minPrevLow;
                breakoutLevel = minPrevLow;
            }
            if (type) {
                return { symbol: symbol, price: coin.lastPrice, change: coin.priceChangePercent, type: type, strength: strength, breakoutLevel: breakoutLevel, klines: klines };
            }
            return null;
        } catch (e) { return null; }
    }
    function openChart(symbol, klines, breakoutLevel, type) {
        document.getElementById('list-view').style.display = 'none';
        document.getElementById('chart-view').style.display = 'flex';
        document.getElementById('chart-title').innerText = symbol;
        renderChart(klines, breakoutLevel, type);
    }
    function closeChart() {
        document.getElementById('chart-view').style.display = 'none';
        document.getElementById('list-view').style.display = 'flex';
        if (myChart) myChart.destroy();
    }
    function renderChart(klines, breakoutLevel, type) {
        const ctx = document.getElementById('priceChart').getContext('2d');
        if (myChart) myChart.destroy();
        const prices = klines.map(k => parseFloat(k[4]));
        const labels = klines.map((k, i) => {
            const d = new Date(k[0]);
            return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        });
        const breakoutIndex = prices.length - 1;
        const annotations = [];
        if (breakoutLevel) {
            annotations.push({ type: 'line', yMin: breakoutLevel, yMax: breakoutLevel, borderColor: type === 'bullish' ? '#0ecb81' : '#f6465d', borderWidth: 2, borderDash: [6, 6], label: { enabled: true, content: type === 'bullish' ? 'Resistance Break' : 'Support Break', position: 'start', backgroundColor: type === 'bullish' ? '#0ecb81' : '#f6465d', color: 'white', font: { size: 10, weight: 'bold' }, xAdjust: 10, yAdjust: -5 } });
            annotations.push({ type: 'label', xValue: breakoutIndex, yValue: breakoutLevel, content: type === 'bullish' ? '▲' : '▼', color: type === 'bullish' ? '#0ecb81' : '#f6465d', font: { size: 30, weight: 'bold' }, backgroundColor: 'rgba(0,0,0,0.8)', borderColor: type === 'bullish' ? '#0ecb81' : '#f6465d', borderWidth: 2, borderRadius: 6, padding: 6, xAdjust: 0, yAdjust: type === 'bullish' ? -25 : 25 });
        }
        const gradient = ctx.createLinearGradient(0, 0, 0, 400);
        gradient.addColorStop(0, 'rgba(14, 203, 129, 0.5)');
        gradient.addColorStop(1, 'rgba(14, 203, 129, 0.0)');
        myChart = new Chart(ctx, {
            type: 'line',
            data: { labels: labels, datasets: [{ label: 'Price', data: prices, borderColor: '#0ecb81', backgroundColor: gradient, borderWidth: 2, pointRadius: 0, fill: true, tension: 0.1 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false }, zoom: { pan: { enabled: true, mode: 'x', threshold: 10 }, zoom: { pinch: { enabled: true }, mode: 'x' } }, annotation: { annotations: annotations } }, scales: { x: { grid: { display: false }, ticks: { color: '#5e6673', maxRotation: 0, autoSkip: true } }, y: { position: 'right', grid: { color: '#2b3139' }, ticks: { color: '#5e6673' } } }, interaction: { mode: 'nearest', axis: 'x', intersect: false } }
        });
    }
</script>
</body>
</html>
