<!DOCTYPE html>
<html>
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}

  font-family: "Optimistic", system-ui, sans-serif;

  font-family: "Optimistic Mono", ui-monospace, monospace;

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breakout Scanner (200) - AUTO PERMANENT ON</title>
<style>
body{background:#0f0f12;color:#fff;font-family:system-ui;margin:0;padding:10px}
header{display:flex;justify-content:space-between;align-items:center;padding:10px;background:#1a1a1f;border-radius:8px}
#auto-btn{padding:10px 15px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;background:#2a2a35;color:#fff}
#auto-btn.active{background:#7c5cfc;color:white}
#refresh-btn{padding:10px 15px;border:none;border-radius:8px;background:#7c5cfc;color:white;font-weight:bold;margin-left:8px}
table{width:100%;border-collapse:collapse;margin-top:12px;background:#1a1a1f;border-radius:8px;overflow:hidden}
th{padding:12px;text-align:left;color:#888;font-size:0.8rem;background:#222}
td{padding:12px;border-top:1px solid #2a2a3a}
.badge-bull{color:#00ff88;background:rgba(0,255,136,0.1);padding:4px 8px;border-radius:4px;border:1px solid #00ff88}
.badge-bear{color:#ff4444;background:rgba(255,68,68,0.1);padding:4px 8px;border-radius:4px;border:1px solid #ff4444}
#status-bar{margin-top:10px;color:#aaa;font-size:0.85rem;text-align:center}
#loader{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#1a1a1f;padding:20px;border-radius:10px;border:1px solid #333}
.symbol-col{font-weight:bold}
</style>
</head>
<body>
<header>
<div>🔍 Breakout Scanner (200) <span style="color:#7c5cfc">AUTO PERMANENT ON</span></div>
<div>
<button id="auto-btn" class="active">Auto: ON (90s)</button>
<button id="refresh-btn" onclick="startScan()">SCAN</button>
</div>
</header>
<div id="status-bar">Auto-scanning every 90 seconds... (Permanent ON)</div>
<div id="loader">Scanning Top 200 Futures... (Please wait)</div>
<div id="empty-msg" style="display:none;text-align:center;padding:20px;color:#666">No breakouts found this scan</div>
<div id="error-msg" style="display:none;text-align:center;padding:20px;color:#f44"></div>
<table>
<thead><tr><th>COIN</th><th>PRICE</th><th>24H %</th><th>SIGNAL</th></tr></thead>
<tbody id="results-body"></tbody>
</table>

<script>
let myChart = null;
let autoInterval = null;
let isAutoOn = true; // PERMANENT ON - was false

window.onload = () => {
    // AUTO START PERMANENTLY ON LOAD - NO TOUCH NEEDED
    const btn = document.getElementById('auto-btn');
    const status = document.getElementById('status-bar');
    isAutoOn = true;
    btn.innerText = "Auto: ON (90s)";
    btn.classList.add('active');
    status.innerText = "Auto-scanning every 90 seconds... (Permanent ON)";
    startScan();
    autoInterval = setInterval(startScan, 90000); // 90s auto
};

function toggleAuto() {
    const btn = document.getElementById('auto-btn');
    const status = document.getElementById('status-bar');
    if (isAutoOn) {
        clearInterval(autoInterval);
        autoInterval = null;
        isAutoOn = false;
        btn.innerText = "Auto: OFF";
        btn.classList.remove('active');
        status.innerText = "Auto-scan stopped.";
    } else {
        isAutoOn = true;
        btn.innerText = "Auto: ON (90s)";
        btn.classList.add('active');
        status.innerText = "Auto-scanning every 90 seconds...";
        startScan();
        autoInterval = setInterval(startScan, 90000);
    }
}
document.getElementById('auto-btn').onclick = toggleAuto;

async function startScan() {
    const btn = document.getElementById('refresh-btn');
    const loader = document.getElementById('loader');
    const tbody = document.getElementById('results-body');
    const emptyMsg = document.getElementById('empty-msg');
    const errorMsg = document.getElementById('error-msg');
    const statusBar = document.getElementById('status-bar');
    if (isAutoOn) btn.disabled = true;
    loader.style.display = 'block';
    loader.innerText = "Scanning Top 200 Futures... (Please wait)";
    tbody.innerHTML = '';
    emptyMsg.style.display = 'none';
    errorMsg.style.display = 'none';
    const startTime = Date.now();
    try {
        const res = await fetch('https://fapi.binance.com/fapi/v1/ticker/24hr');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const allCoins = data.filter(t => t.symbol.endsWith('USDT') && !t.symbol.includes('_'));
        const topCoins = allCoins.sort((a, b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume)).slice(0,200);
        console.log(`Scanning ${topCoins.length} coins...`);
        loader.innerText = `Scanning ${topCoins.length} coins...`;
        let signals = [];
        for (let i = 0; i < topCoins.length; i += 10) {
            const batch = topCoins.slice(i, i + 10);
            const promises = batch.map(coin => checkBreakout(coin));
            const results = await Promise.all(promises);
            results.forEach(r => { if (r) signals.push(r); });
            const progress = Math.min(100, Math.floor((i / topCoins.length)*100));
            loader.innerText = `Scanning... ${progress}%`;
            await new Promise(r => setTimeout(r, 250));
        }
        loader.style.display = 'none';
        const scanTime = ((Date.now() - startTime)/1000).toFixed(1);
        if (isAutoOn) statusBar.innerText = `Last scan: ${scanTime}s ago • ${signals.length} signals • Auto: ON (90s) - Permanent`;
        if (signals.length === 0) {
            emptyMsg.style.display = 'block';
        } else {
            signals.sort((a, b) => b.strength - a.strength);
            signals.forEach(signal => {
                const row = document.createElement('tr');
                const changeNum = parseFloat(signal.change) || 0;
                const changeColor = changeNum >= 0 ? 'var(--accent)' : '#ff6b6b';
                const badgeClass = signal.type === 'bullish' ? 'badge-bull' : 'badge-bear';
                const badgeText = signal.type === 'bullish' ? '▲ BREAKOUT' : '▼ DUMP';
                row.innerHTML = `<td class="symbol-col">${signal.symbol.replace('USDT','')}</td><td>$${parseFloat(signal.price).toFixed(3)}</td><td style="color:${changeColor}">${changeNum>=0?'+':''}${changeNum.toFixed(2)}%</td><td><span class="${badgeClass}">${badgeText}</span></td>`;
                tbody.appendChild(row);
            });
        }
    } catch (err) {
        console.error(" Scan failed:", err);
        if (!isAutoOn) {
            errorMsg.innerText = `Error: ${err.message}. Try again.`;
            errorMsg.style.display = 'block';
        }
        loader.style.display = 'none';
    } finally {
        if (!isAutoOn) btn.disabled = false;
    }
}

async function checkBreakout(coin) {
    const symbol = coin.symbol;
    try {
        const kRes = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=4h&limit=20`);
        if (!kRes.ok) return null;
        const klines = await kRes.json();
        if (klines.length < 5) return null;
        const prices = klines.map(k => parseFloat(k[4]));
        const highs = klines.map(k => parseFloat(k[2]));
        const lows = klines.map(k => parseFloat(k[3]));
        const threshold = 0.002; // 0.2% - was 0.01 - MORE SIGNALS - AUTO PERMANENT
        const currentPrice = prices[prices.length-1];
        const prevHighs = [highs[highs.length-2], highs[highs.length-3], highs[highs.length-4]];
        const prevLows = [lows[lows.length-2], lows[lows.length-3], lows[lows.length-4]];
        const maxPrevHigh = Math.max(...prevHighs);
        const minPrevLow = Math.min(...prevLows);
        let type = null;
        let strength = 0;
        let breakoutLevel = 0;
        if (currentPrice > maxPrevHigh * (1 + threshold)) {
            type = 'bullish';
            strength = (currentPrice - maxPrevHigh) / maxPrevHigh;
            breakoutLevel = maxPrevHigh;
        } else if (currentPrice < minPrevLow * (1 - threshold)) {
            type = 'bearish';
            strength = (minPrevLow - currentPrice) / minPrevLow;
            breakoutLevel = minPrevLow;
        }
        if (type) {
            return { symbol: symbol, price: coin.lastPrice, change: coin.priceChangePercent, type: type, strength: strength, level: breakoutLevel, klines: klines };
        }
        return null;
    } catch (e) { return null; }
}
</script>

</html>
